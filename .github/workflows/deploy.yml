name: Deploy to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Secrets live under the github-pages ENVIRONMENT, so this job must
    # declare it — environment secrets are never visible to jobs without one.
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Smoke test (homepage 200 + bundled assets, not raw source)
        run: |
          url="${{ needs.deploy.outputs.url }}"
          code=$(curl -s -o /dev/null -w "%{http_code}" "$url")
          echo "Homepage: $code"
          test "$code" = "200"

          html=$(curl -s "$url")
          # Fail loudly if Pages ever regresses to legacy/branch mode: serving
          # raw /src/main.tsx is exactly what blanked the site before.
          if echo "$html" | grep -q '/src/main.tsx'; then
            echo "::error::Serving raw /src/main.tsx — Pages is in 'Deploy from a branch' mode. Set Source to 'GitHub Actions' in Settings → Pages."
            exit 1
          fi

          # The built bundle must exist and be fetchable.
          asset=$(echo "$html" | grep -o 'src="/assets/[^"]*\.js"' | head -1 | sed 's/src="//;s/"//')
          echo "Bundle: $asset"
          test -n "$asset"
          acode=$(curl -s -o /dev/null -w "%{http_code}" "$url$asset")
          echo "Bundle status: $acode"
          test "$acode" = "200"
