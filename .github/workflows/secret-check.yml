name: Secret check (temporary)
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify repo secrets exist (values never printed)
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          [ -n "$URL" ] && echo "VITE_SUPABASE_URL: SET" || echo "VITE_SUPABASE_URL: MISSING"
          [ -n "$KEY" ] && echo "VITE_SUPABASE_ANON_KEY: SET" || echo "VITE_SUPABASE_ANON_KEY: MISSING"
          [ -n "$URL" ] && [ -n "$KEY" ] || exit 1
